theme = "xjq-dark"

[editor]
shell = ["nu", "-c"]
# auto-completion = false
line-number = "relative"
cursorline = true
scroll-lines = 15
auto-pairs = true
scrolloff = 15
mouse = false
continue-comments = false
# auto-info = false #disable hints
text-width = 80
rulers = [81]
end-of-line-diagnostics = "hint"
jump-label-alphabet = "tnseriaoplvmgjbkdhfuc,"
completion-trigger-len = 3

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[editor.whitespace.render]
newline = "all"

[editor.whitespace.characters]
newline = "𐫴"


[keys.normal]
X = ["extend_line_above", "select_mode"]
x = ["extend_line_below", "select_mode"]

C-l = "jump_view_right"
C-h = "jump_view_left"
C-k = "jump_view_up"
C-j = "jump_view_down"

C-u = "@z<backspace>zz"
C-d = "@z<space>zz"


[keys.select]
X = "extend_line_above"

I = ["split_selection_on_newline", "goto_first_nonwhitespace", "collapse_selection"]
A = ["split_selection_on_newline", "goto_line_end", "collapse_selection"]

[keys.normal.g]
q = [":reflow"]

[keys.normal.z]
i = [":toggle inline-diagnostics.cursor-line disable"]
o = [":toggle inline-diagnostics.cursor-line hint"]

[keys.normal."space"]
f = "file_picker_in_current_directory"
n = "hover"
# e = [":new", ":insert-output yazi", ":buffer-close!", ":redraw"]
y = ":clipboard-yank"
p = ":primary-clipboard-paste-replace"

[keys.insert]
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"
pageup = "no_op"
pagedown = "no_op"
home = "no_op"
end = "no_op"
